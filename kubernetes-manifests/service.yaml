apiVersion: v1
kind: Service
metadata:
  name: netflix-clone-service
  labels:
    app: netflix-clone
spec:
  type: NodePort # Exposes the service on a port on each Node of the cluster
  selector:
    app: netflix-clone
  ports:
    - protocol: TCP
      port: 80 # Port inside the cluster
      targetPort: 80 # Port of the container
      nodePort: 30001 # <--- Choose a NodePort between 30000-32767. This is what you'll access from outside.
